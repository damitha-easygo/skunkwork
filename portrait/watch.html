<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 9 16%22%3E%3Crect width=%229%22 height=%227.8%22 fill=%22%23ff4d6d%22/%3E%3Crect y=%228.2%22 width=%229%22 height=%227.8%22 fill=%22%234dabff%22/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Portrait Stack</title>
<style>
	html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; }
	body {
		font: 14px/1.4 system-ui, sans-serif;
		display: grid; place-items: center;
		height: 100dvh;
		padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
		box-sizing: border-box;
		-webkit-user-select: none; user-select: none;
		-webkit-tap-highlight-color: transparent;
	}
	#out {
		display: block;
		aspect-ratio: 9 / 16;
		width: min(100%, calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 9 / 16));
		background: #000;
	}
	/* Kept in the DOM and "visible" so mobile browsers keep decoding it; we only draw from it. */
	#video { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; left: 0; top: 0; }
	.overlay {
		position: fixed; left: 50%; transform: translateX(-50%);
		padding: 8px 14px; border-radius: 99px; background: rgba(0, 0, 0, .6);
		backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
		font-size: 13px; white-space: nowrap;
	}
	#status { top: calc(12px + env(safe-area-inset-top)); }
	#status.live::before { content: "● "; color: #ff3b5c; }
	#tap { bottom: calc(20px + env(safe-area-inset-bottom)); border: 0; color: #fff; font: inherit; font-size: 15px; padding: 12px 20px; }
	[hidden] { display: none !important; }
</style>
  <script type="module" crossorigin src="./assets/watch-CTiJ2b1A.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/shared-XquFmhTq.js">
</head>
<body>
	<canvas id="out" width="1080" height="1920"></canvas>
	<video id="video" crossorigin="anonymous" playsinline muted autoplay></video>
	<div id="status" class="overlay">connecting…</div>
	<button id="tap" class="overlay" hidden>Tap for sound 🔊</button>
</body>
</html>
